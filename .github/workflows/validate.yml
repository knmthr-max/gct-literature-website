name: Validate data

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON data
        run: |
          for f in data/papers/*.json; do python3 -m json.tool "$f" > /dev/null; done
          python3 -m json.tool data/site.json > /dev/null
          echo "JSON OK"
      - name: Check for duplicate IDs
        run: |
          python3 - <<'EOF'
          import json, collections, sys
          index = json.load(open("data/papers/index.json"))
          papers = [p for name in index["shards"] for p in json.load(open("data/papers/" + name))]
          ids = [p.get("id") for p in papers]
          dup = [i for i, c in collections.Counter(ids).items() if c > 1]
          missing = [p for p in papers if not (p.get("id") and p.get("title") and p.get("year"))]
          if dup:
              sys.exit(f"重複ID: {dup}")
          if missing:
              sys.exit(f"必須フィールド(id/title/year)欠落: {len(missing)}件")
          print(f"{len(papers)} entries OK")
          EOF
      - name: Run programs/ regression tests
        run: python3 -m unittest discover -s programs/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Search - unit tests
        run: |
          npm ci
          npm run test:search
      - name: Search - build data and check it against a plain full-text match
        run: |
          npm run build:search
          npx playwright install --with-deps chromium
          npm run check:search
      - name: Filter - basic/clinical and study-design filters against the data
        run: npm run check:filter
      - name: Filter - attribute filters (site, tag, histology, themes) against the data
        run: npm run check:attr
      - name: Split loading (head / list / details) of the list data
        run: npm run check:split
